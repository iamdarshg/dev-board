name: PCBWay PTH-via experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pcbway-minimum-pth-drill:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Enforce PCBWay mechanical PTH drill minimum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          drills = Path("dev-real-production-fab/dev-real-production-PTH.drl").read_text()
          sizes = [float(v) for v in re.findall(r"^T\\d+C([0-9.]+)$", drills, re.M)]
          bad = [size for size in sizes if size < 0.15]
          print(f"PTH tool sizes: {sizes}")
          if bad:
              sys.exit(f"PCBWay requires >= 0.15 mm mechanical/PTH drill; found {bad}")
          PY
