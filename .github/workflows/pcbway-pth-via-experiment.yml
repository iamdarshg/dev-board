name: PCBWay PTH-via experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pcbway-minimum-pth-drill:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Create PCBWay-compatible PTH-via candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, sys

          text = Path("dev-real-production.kicad_pcb").read_text()
          out, cursor, changed, points = [], 0, 0, []
          while True:
              start = text.find("(via", cursor)
              if start < 0:
                  out.append(text[cursor:])
                  break
              out.append(text[cursor:start])
              depth, end = 0, start
              while end < len(text):
                  depth += (text[end] == "(") - (text[end] == ")")
                  end += 1
                  if depth == 0:
                      break
              block = text[start:end]
              if "(drill 0.127)" in block:
                  at = block.find("(at ") + len("(at ")
                  at_end = block.find(")", at)
                  points.append(tuple(map(float, block[at:at_end].split()[:2])))
                  size_start = block.find("(size ")
                  if size_start < 0: sys.exit("0.127 mm drill found without a via size")
                  value_start = size_start + len("(size ")
                  value_end = block.find(")", value_start)
                  block = block[:value_start] + "0.31" + block[value_end:]
                  block = block.replace("(drill 0.127)", "(drill 0.15)", 1)
                  changed += 1
              out.append(block)
              cursor = end
          if changed == 0: sys.exit("No 0.127 mm PTH vias were found")
          Path("dev-real-production-pcbway-candidate.kicad_pcb").write_text("".join(out))
          shutil.copyfile("dev-real-production.kicad_pro", "dev-real-production-pcbway-candidate.kicad_pro")

          xs, ys = zip(*points)
          margin = 3
          xmin, xmax = min(xs)-margin, max(xs)+margin
          ymin, ymax = min(ys)-margin, max(ys)+margin
          w, h = 1600, max(800, int(1600*(ymax-ymin)/(xmax-xmin)))
          def xy(p):
              x, y = p
              return 40+(x-xmin)/(xmax-xmin)*(w-80), 40+(y-ymin)/(ymax-ymin)*(h-80)
          circles = "".join(f'<circle cx="{xy(p)[0]:.2f}" cy="{xy(p)[1]:.2f}" r="2.5"/>' for p in points)
          Path("pcbway-via-change-map.svg").write_text(f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">
          <rect width="100%" height="100%" fill="#111827"/><text x="40" y="32" fill="white" font-size="22">713 PTH vias proposed for 0.15 mm PCBWay drill</text>
          <rect x="40" y="40" width="{w-80}" height="{h-80}" fill="#e5e7eb" stroke="#94a3b8"/><g fill="#ef4444" opacity="0.82">{circles}</g>
          <text x="40" y="{h-12}" fill="white" font-size="16">Red = every via whose pad expansion must be checked/rerouted</text></svg>''')
          print(f"promoted {changed} PTH vias")
          PY
      - name: Verify candidate has no undersized PTH drills
        run: |
          if grep -q '(drill 0.127)' dev-real-production-pcbway-candidate.kicad_pcb; then exit 1; fi
      - name: Probe headless Specctra bridge for the reroute trial
        run: |
          python3 - <<'PY'
          try:
              import pcbnew
          except Exception as exc:
              print(f"pcbnew Python module unavailable: {exc}")
              raise SystemExit(0)
          names = [name for name in dir(pcbnew) if "Specctra" in name or "SPECCTRA" in name]
          print("Specctra API candidates:", names)
          board = pcbnew.LoadBoard("dev-real-production-pcbway-candidate.kicad_pcb")
          print("board loaded:", board.GetFileName(), "tracks:", len(list(board.GetTracks())))
          PY
      - name: Run KiCad DRC on candidate
        run: kicad-cli pcb drc --output pcbway-candidate-drc.json --format json --severity-error dev-real-production-pcbway-candidate.kicad_pcb
      - name: Prepare a targeted reroute input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil
          
          report = json.loads(Path("pcbway-candidate-drc.json").read_text())
          removable = set()
          for violation in report["violations"]:
              for item in violation.get("items", []):
                  description = item["description"]
                  if description.startswith(("Track ", "Via ", "Blind/Buried ")):
                      removable.add(item["uuid"])
          
          source = Path("dev-real-production-pcbway-candidate.kicad_pcb").read_text()
          out, cursor, removed = [], 0, {"Track": 0, "Via": 0}
          while True:
              starts = [p for p in (source.find("(segment", cursor), source.find("(via", cursor)) if p >= 0]
              if not starts:
                  out.append(source[cursor:])
                  break
              start = min(starts)
              out.append(source[cursor:start])
              depth, end = 0, start
              while end < len(source):
                  depth += (source[end] == "(") - (source[end] == ")")
                  end += 1
                  if depth == 0:
                      break
              block = source[start:end]
              uuid = re.search(r'\(uuid "([^"]+)"\)', block)
              if uuid and uuid.group(1) in removable:
                  removed["Track" if block.startswith("(segment") else "Via"] += 1
              else:
                  out.append(block)
              cursor = end
          Path("pcbway-reroute-input.kicad_pcb").write_text("".join(out))
          shutil.copyfile("dev-real-production-pcbway-candidate.kicad_pro", "pcbway-reroute-input.kicad_pro")
          Path("reroute-input-summary.json").write_text(json.dumps({
              "candidate_drc_violations": len(report["violations"]),
              "removed_conflicting_tracks": removed["Track"],
              "removed_conflicting_vias": removed["Via"],
              "preserved_zones_and_pads": True,
          }, indent=2))
          print(json.dumps(json.loads(Path("reroute-input-summary.json").read_text())))
          PY
      - name: Export targeted reroute input to Specctra DSN
        run: |
          python3 - <<'PY'
          import pcbnew
          board = pcbnew.LoadBoard("pcbway-reroute-input.kicad_pcb")
          if not pcbnew.ExportSpecctraDSN(board, "pcbway-reroute-input.dsn"):
              raise SystemExit("Specctra DSN export failed")
          PY
      - name: Download stable Freerouting CLI
        run: |
          if ! command -v java >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends default-jre-headless
          fi
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib
          url = "https://github.com/freerouting/freerouting/releases/download/v2.2.4/freerouting-2.2.4.jar"
          payload = urlopen(url, timeout=60).read()
          Path("freerouting-2.2.4.jar").write_bytes(payload)
          print("freerouting jar bytes=", len(payload), "sha256=", hashlib.sha256(payload).hexdigest())
          PY
          java -jar freerouting-2.2.4.jar -help | head -30
      - name: Autoroute only the deliberately opened conflict sites
        id: route
        continue-on-error: true
        run: |
          timeout 360s java -jar freerouting-2.2.4.jar             --gui.enabled=false --user_data_path=freerouting-user-data             -de pcbway-reroute-input.dsn -do pcbway-rerouted.ses             -mp 12 -mt 2 -dct 1 -da             --logging.console.level=INFO             | tee freerouting-route.log
      - name: Import the route trial into a disposable KiCad board
        id: import_route
        if: always() && steps.route.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import pcbnew, shutil
          board = pcbnew.LoadBoard("pcbway-reroute-input.kicad_pcb")
          if not pcbnew.ImportSpecctraSES(board, "pcbway-rerouted.ses"):
              raise SystemExit("Specctra SES import failed")
          pcbnew.SaveBoard("pcbway-rerouted.kicad_pcb", board)
          shutil.copyfile("pcbway-reroute-input.kicad_pro", "pcbway-rerouted.kicad_pro")
          PY
      - name: DRC-check the rerouted trial
        if: always() && steps.import_route.outcome == 'success'
        continue-on-error: true
        run: |
          kicad-cli pcb drc --output pcbway-rerouted-drc.json --format json --severity-error pcbway-rerouted.kicad_pcb
          kicad-cli pcb export svg --output pcbway-rerouted-top.svg --layers F.Cu pcbway-rerouted.kicad_pcb
      - name: Summarize route trial
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for report in ("pcbway-candidate-drc.json", "pcbway-rerouted-drc.json"):
              path = Path(report)
              if path.exists():
                  data = json.loads(path.read_text())
                  print(f"{report}: violations={len(data.get('violations', []))}, unconnected={len(data.get('unconnected_items', []))}")
          PY
      - name: Export candidate top-copper view
        run: kicad-cli pcb export svg --output pcbway-candidate-top.svg --layers F.Cu dev-real-production-pcbway-candidate.kicad_pcb
      - name: Summarize candidate violations
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          report = pathlib.Path("pcbway-candidate-drc.json")
          if report.exists():
              data = json.loads(report.read_text())
              print("candidate violations=", len(data.get("violations", [])))
              print("candidate unconnected=", len(data.get("unconnected_items", [])))
          PY
      - name: Upload PCBWay visual DFM package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcbway-via-dfm-visuals
          path: |
            pcbway-via-change-map.svg
            pcbway-candidate-drc.json
            pcbway-candidate-top.svg
            dev-real-production-pcbway-candidate.kicad_pcb
