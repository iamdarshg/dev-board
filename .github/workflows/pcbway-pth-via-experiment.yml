name: PCBWay PTH-via experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pcbway-minimum-pth-drill:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Create PCBWay-compatible PTH-via candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("dev-real-production.kicad_pcb")
          candidate = Path("dev-real-production-pcbway-candidate.kicad_pcb")
          text = source.read_text()
          drill_count = text.count("(drill 0.127)")
          size_count = text.count("(size 0.254)")
          if drill_count == 0:
              sys.exit("No 0.127 mm PTH drills were found")
          if size_count < drill_count:
              sys.exit(f"Cannot safely promote: {drill_count} drills but only {size_count} matching via pads")

          # Existing 0.127 mm drills are the 0.254 mm PTH-via class. 0.31 mm
          # pads leave a 0.08 mm annular ring with the PCBWay 0.15 mm drill.
          updated = text.replace("(size 0.254)", "(size 0.31)")
          updated = updated.replace("(drill 0.127)", "(drill 0.15)")
          candidate.write_text(updated)
          print(f"promoted {drill_count} PTH via drills; expanded {size_count} 0.254 mm via pads")
          PY
      - name: Verify candidate has no undersized PTH drills
        run: |
          if grep -q '(drill 0.127)' dev-real-production-pcbway-candidate.kicad_pcb; then
            exit 1
          fi
      - name: Run KiCad DRC on candidate
        run: |
          kicad-cli pcb drc --output pcbway-candidate-drc.json --format json --severity-error --exit-code-violations dev-real-production-pcbway-candidate.kicad_pcb
      - name: Enforce clean DRC and unconnected count
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("pcbway-candidate-drc.json")
          if not report.exists():
              sys.exit("candidate DRC report was not generated")
          data = json.loads(report.read_text())
          violations = data.get("violations", [])
          unconnected = data.get("unconnected_items", [])
          print(f"candidate violations={len(violations)} unconnected={len(unconnected)}")
          for violation in violations[:100]:
              print("VIOL:", violation.get("type"), violation.get("description"))
          if violations or unconnected:
              sys.exit("PCBWay via candidate is not DRC clean")
          PY
      - name: Upload candidate DRC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcbway-candidate-drc
          path: pcbway-candidate-drc.json
