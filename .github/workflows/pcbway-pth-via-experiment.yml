name: PCBWay PTH-via experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pcbway-minimum-pth-drill:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Create PCBWay-compatible PTH-via candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, sys

          text = Path("dev-real-production.kicad_pcb").read_text()
          out, cursor, changed, original_sizes = [], 0, 0, []
          while True:
              start = text.find("(via", cursor)
              if start < 0:
                  out.append(text[cursor:])
                  break
              out.append(text[cursor:start])
              depth, end = 0, start
              while end < len(text):
                  depth += (text[end] == "(") - (text[end] == ")")
                  end += 1
                  if depth == 0:
                      break
              block = text[start:end]
              if "(drill 0.127)" in block:
                  size_start = block.find("(size ")
                  if size_start < 0: sys.exit("0.127 mm drill found without a via size")
                  value_start = size_start + len("(size ")
                  value_end = block.find(")", value_start)
                  original_sizes.append(block[value_start:value_end])
                  block = block[:value_start] + "0.31" + block[value_end:]
                  block = block.replace("(drill 0.127)", "(drill 0.15)", 1)
                  changed += 1
              out.append(block)
              cursor = end
          if changed == 0: sys.exit("No 0.127 mm PTH vias were found")
          Path("dev-real-production-pcbway-candidate.kicad_pcb").write_text("".join(out))
          # KiCad selects board rules from the same-basename project file.
          shutil.copyfile("dev-real-production.kicad_pro", "dev-real-production-pcbway-candidate.kicad_pro")
          print(f"promoted {changed} PTH vias; original pad sizes: {sorted(set(original_sizes))}")
          PY
      - name: Verify candidate has no undersized PTH drills
        run: |
          if grep -q '(drill 0.127)' dev-real-production-pcbway-candidate.kicad_pcb; then exit 1; fi
      - name: Run KiCad DRC on candidate using production rules
        run: kicad-cli pcb drc --output pcbway-candidate-drc.json --format json --severity-error --exit-code-violations dev-real-production-pcbway-candidate.kicad_pcb
      - name: Enforce clean DRC and unconnected count
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("pcbway-candidate-drc.json")
          if not report.exists(): sys.exit("candidate DRC report was not generated")
          data = json.loads(report.read_text())
          violations, unconnected = data.get("violations", []), data.get("unconnected_items", [])
          print(f"candidate violations={len(violations)} unconnected={len(unconnected)}")
          for v in violations[:100]: print("VIOL:", v.get("type"), v.get("description"))
          if violations or unconnected: sys.exit("PCBWay via candidate is not DRC clean")
          PY
